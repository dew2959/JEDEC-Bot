version: "3.8"

services:
  jedec-bot:
    build: 
      context: .
      dockerfile: Dockerfile

    container_name: jedec-chatbot-container

    ports:
      - 8501:8501

    env_file:
      - .env

    volumes:
      - .:/app

    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0